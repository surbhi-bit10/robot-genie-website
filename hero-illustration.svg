<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="indigoCyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow & Neural Dots -->
  <rect x="20" y="20" width="560" height="460" rx="32" fill="url(#bgGlow)"/>
  
  <g opacity="0.4">
    <circle cx="90" cy="80" r="3" fill="#6366F1"/>
    <circle cx="150" cy="60" r="2" fill="#06B6D4"/>
    <circle cx="510" cy="90" r="3" fill="#3B82F6"/>
    <circle cx="480" cy="420" r="3" fill="#6366F1"/>
    <circle cx="80" cy="410" r="2.5" fill="#06B6D4"/>
    <path d="M90 80L150 60M510 90L460 120" stroke="#CBD5E1" stroke-dasharray="3 3"/>
  </g>

  <!-- Central Main Dashboard Window -->
  <g filter="url(#softShadow)">
    <rect x="70" y="90" width="460" height="320" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect x="70" y="90" width="460" height="42" rx="20" fill="#F8FAFC"/>
    <rect x="70" y="112" width="460" height="20" fill="#F8FAFC"/>
    <line x1="70" y1="132" x2="530" y2="132" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="96" cy="111" r="5" fill="#EF4444"/>
    <circle cx="112" cy="111" r="5" fill="#F59E0B"/>
    <circle cx="128" cy="111" r="5" fill="#10B981"/>
    <!-- Search / AI Prompt Bar in Header -->
    <rect x="156" y="100" width="220" height="22" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="170" cy="111" r="3" fill="#94A3B8"/>
    <rect x="180" y="108" width="90" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="470" y="102" width="45" height="18" rx="9" fill="#EEF2FF"/>
    <rect x="478" y="108" width="28" height="6" rx="3" fill="#6366F1"/>
  </g>

  <!-- Left Sidebar / Modules in Dashboard -->
  <g>
    <rect x="90" y="152" width="110" height="238" rx="12" fill="#F8FAFC" stroke="#F1F5F9"/>
    <!-- Menu items -->
    <rect x="102" y="170" width="86" height="24" rx="6" fill="#EEF2FF"/>
    <circle cx="112" cy="182" r="3.5" fill="#4F46E5"/>
    <rect x="122" y="179" width="54" height="6" rx="3" fill="#4F46E5"/>

    <rect x="102" y="204" width="86" height="22" rx="6" fill="#FFFFFF"/>
    <circle cx="112" cy="215" r="3.5" fill="#94A3B8"/>
    <rect x="122" y="212" width="48" height="6" rx="3" fill="#94A3B8"/>

    <rect x="102" y="234" width="86" height="22" rx="6" fill="#FFFFFF"/>
    <circle cx="112" cy="245" r="3.5" fill="#94A3B8"/>
    <rect x="122" y="242" width="56" height="6" rx="3" fill="#94A3B8"/>

    <rect x="102" y="264" width="86" height="22" rx="6" fill="#FFFFFF"/>
    <circle cx="112" cy="275" r="3.5" fill="#94A3B8"/>
    <rect x="122" y="272" width="42" height="6" rx="3" fill="#94A3B8"/>

    <!-- Small Institute Info Badge -->
    <rect x="100" y="320" width="90" height="52" rx="8" fill="#F1F5F9"/>
    <rect x="108" y="332" width="50" height="6" rx="3" fill="#64748B"/>
    <rect x="108" y="344" width="70" height="5" rx="2.5" fill="#94A3B8"/>
    <rect x="108" y="355" width="40" height="5" rx="2.5" fill="#06B6D4"/>
  </g>

  <!-- Main Chart & Analytics Area -->
  <g>
    <!-- Top KPI cards -->
    <rect x="216" y="152" width="90" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="228" y="164" width="40" height="5" rx="2.5" fill="#94A3B8"/>
    <rect x="228" y="175" width="52" height="10" rx="3" fill="#0F172A"/>
    <path d="M228 194L238 190L245 192L254 186" stroke="#10B981" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="318" y="152" width="90" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="330" y="164" width="44" height="5" rx="2.5" fill="#94A3B8"/>
    <rect x="330" y="175" width="50" height="10" rx="3" fill="#0F172A"/>
    <path d="M330 192L340 188L348 193L358 185" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round"/>

    <rect x="420" y="152" width="90" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="432" y="164" width="48" height="5" rx="2.5" fill="#94A3B8"/>
    <rect x="432" y="175" width="46" height="10" rx="3" fill="#0F172A"/>
    <path d="M432 193L442 189L450 191L460 184" stroke="#06B6D4" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Chart Box -->
    <rect x="216" y="222" width="294" height="168" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="232" y="238" width="110" height="8" rx="4" fill="#0F172A"/>
    <rect x="232" y="250" width="80" height="5" rx="2.5" fill="#94A3B8"/>

    <!-- Chart grid lines -->
    <line x1="232" y1="290" x2="494" y2="290" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="232" y1="325" x2="494" y2="325" stroke="#F1F5F9" stroke-width="1"/>
    <line x1="232" y1="360" x2="494" y2="360" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Chart Fill Area -->
    <path d="M236 345C260 330 280 320 310 295C340 270 370 285 410 255C440 235 465 240 490 220V360H236Z" fill="url(#chartGrad)"/>
    <!-- Growth Line -->
    <path d="M236 345C260 330 280 320 310 295C340 270 370 285 410 255C440 235 465 240 490 220" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Secondary Indigo Trend Line -->
    <path d="M236 355C265 348 290 335 325 320C360 305 390 310 430 285C460 265 480 250 490 240" stroke="#4F46E5" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>

    <circle cx="310" cy="295" r="4" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="410" cy="255" r="4" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="490" cy="220" r="5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Floating Floating Card 1: AI Assistant / Robot Genie Badge -->
  <g filter="url(#softShadow)">
    <rect x="42" y="240" width="130" height="96" rx="14" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="1.5"/>
    <!-- Mini Robot Avatar -->
    <rect x="54" y="254" width="32" height="32" rx="8" fill="url(#indigoCyanGrad)"/>
    <circle cx="65" cy="268" r="2" fill="#FFFFFF"/>
    <circle cx="75" cy="268" r="2" fill="#FFFFFF"/>
    <path d="M66 274C68 276 72 276 74 274" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="94" y="258" width="64" height="7" rx="3.5" fill="#0F172A"/>
    <rect x="94" y="271" width="48" height="5" rx="2.5" fill="#06B6D4"/>
    <rect x="54" y="298" width="106" height="24" rx="6" fill="#EEF2FF"/>
    <rect x="62" y="307" width="90" height="6" rx="3" fill="#4F46E5"/>
  </g>

  <!-- Floating Card 2: Marketing ROI / Conversion Pulse -->
  <g filter="url(#softShadow)">
    <rect x="430" y="40" width="144" height="88" rx="14" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1.5"/>
    <rect x="444" y="54" width="28" height="28" rx="7" fill="#DCFCE7"/>
    <path d="M452 70L456 65L460 68L465 60" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="480" y="56" width="76" height="7" rx="3.5" fill="#0F172A"/>
    <rect x="480" y="69" width="50" height="5" rx="2.5" fill="#16A34A"/>
    <rect x="444" y="94" width="116" height="20" rx="5" fill="#F0FDF4"/>
    <rect x="454" y="101" width="96" height="6" rx="3" fill="#15803D"/>
  </g>

  <!-- Floating Card 3: SEO & AI Keywords Tag Cloud -->
  <g filter="url(#softShadow)">
    <rect x="360" y="380" width="180" height="74" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="372" y="394" width="45" height="18" rx="9" fill="#EEF2FF"/>
    <text x="382" y="406" font-family="sans-serif" font-size="9" font-weight="bold" fill="#4F46E5">SEO</text>
    
    <rect x="424" y="394" width="56" height="18" rx="9" fill="#ECFEFF"/>
    <text x="433" y="406" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0891B2">AI Tools</text>

    <rect x="486" y="394" width="44" height="18" rx="9" fill="#FEF3C7"/>
    <text x="495" y="406" font-family="sans-serif" font-size="9" font-weight="bold" fill="#B45309">Ads</text>

    <rect x="372" y="420" width="76" height="18" rx="9" fill="#F3E8FF"/>
    <text x="382" y="432" font-family="sans-serif" font-size="9" font-weight="bold" fill="#7E22CE">Automation</text>

    <rect x="455" y="420" width="75" height="18" rx="9" fill="#F1F5F9"/>
    <text x="465" y="432" font-family="sans-serif" font-size="9" font-weight="bold" fill="#334155">Analytics</text>
  </g>

  <!-- Sparkles / Tech accents -->
  <path d="M75 55L76.5 60L81.5 61.5L76.5 63L75 68L73.5 63L68.5 61.5L73.5 60Z" fill="#F59E0B"/>
  <path d="M530 200L531.5 204L535.5 205.5L531.5 207L530 211L528.5 207L524.5 205.5L528.5 204Z" fill="#06B6D4"/>
  <path d="M200 70L201 73L204 74L201 75L200 78L199 75L196 74L199 73Z" fill="#818CF8"/>
</svg>
